[package]
name = "grader"
version = "0.1.0"
edition = "2024"

[dependencies]
litesvm = "=0.18.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-account = "4.7"
solana-address = { version = "2.7", features = ["curve25519", "decode"] }
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-transaction = "4.1"
